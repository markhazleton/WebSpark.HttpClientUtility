name: Continuous Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dotnet-build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Setup .NET 10 SDK (Preview)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          dotnet-quality: preview

      - name: Display installed .NET SDKs
        run: dotnet --list-sdks

      - name: Restore solution
        run: dotnet restore WebSpark.HttpClientUtility.sln

      - name: Build solution
        run: dotnet build WebSpark.HttpClientUtility.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test WebSpark.HttpClientUtility.sln --configuration Release --no-build --verbosity normal --logger "trx" --collect:"XPlat Code Coverage"

      - name: Check NuGet vulnerabilities
        run: dotnet list WebSpark.HttpClientUtility.sln package --vulnerable --include-transitive

  frontend-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WebSpark.HttpClientUtility.Web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: WebSpark.HttpClientUtility.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Security audit
        run: npm audit --audit-level=high

  docs-site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build documentation
        run: npm run build

      - name: Validate generated HTML
        run: npm run validate

      - name: Security audit
        run: npm audit --audit-level=high